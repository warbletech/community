<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reusable thumbnail template — 1280 x 720, YouTube native.
  Edit the <text> nodes to retitle for each video. Render to PNG with rsvg-convert.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#06090C"/>
      <stop offset="100%" stop-color="#0a1f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <symbol id="bird" viewBox="0 0 100 100">
      <path d="M10 60 C 30 50, 45 50, 58 56 L 78 38 L 72 60 L 92 60 L 70 72 L 78 92 L 58 72 C 45 78, 30 78, 10 70 Z" fill="url(#accent)"/>
      <path d="M30 60 Q 45 30, 70 50 Q 50 56, 38 68 Z" fill="url(#accent)" opacity="0.85"/>
      <circle cx="80" cy="52" r="3" fill="#06090C"/>
    </symbol>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="980" cy="360" r="320" fill="url(#glow)"/>

  <!-- Big bird -->
  <use href="#bird" x="900" y="220" width="280" height="280"/>

  <!-- Eyebrow -->
  <text x="80" y="180" font-family="'JetBrains Mono','Menlo',monospace"
        font-size="28" font-weight="700" letter-spacing="6"
        fill="#10b981">WARBLE CLOUD</text>

  <!-- Headline (replace per video) -->
  <text x="80" y="290" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="84" font-weight="800" letter-spacing="-3" fill="#ffffff">WE'RE BUILDING</text>
  <text x="80" y="380" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="84" font-weight="800" letter-spacing="-3" fill="url(#accent)">THIS IN PUBLIC</text>

  <!-- Subhead -->
  <text x="80" y="450" font-family="'Plus Jakarta Sans','Inter',sans-serif"
        font-size="36" font-weight="500" letter-spacing="0" fill="#94a3b8">Meet the flock — Starling · Reflexion · Brain</text>

  <!-- Bottom strip -->
  <rect x="0" y="640" width="1280" height="80" fill="#06090C"/>
  <rect x="0" y="640" width="1280" height="3" fill="url(#accent)"/>
  <text x="80" y="690" font-family="'JetBrains Mono','Menlo',monospace"
        font-size="26" font-weight="600" letter-spacing="2" fill="#10b981">@Warble-Tech</text>
  <text x="1200" y="690" text-anchor="end"
        font-family="'JetBrains Mono','Menlo',monospace"
        font-size="26" font-weight="600" letter-spacing="2" fill="#4a7060">warblecloud.com</text>
</svg>
